[env:firebeetle32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.flash_size = 4MB
board_build.partitions = default.csv
extra_scripts = pre:patch_lidar.py
build_flags =
    -D FLESPI_TOKEN=\"QZBImJsYXGlviI2NJprnuLAZs5Mzdl1p6y6NcXGJcA05wgbFShRxgwke65khn3Qy\"
    -D DEVICE_ID=\"8235942\"
    -D WIFI_SSID=\"WiFi2773ehy\"
    -D WIFI_PASSWORD=\"x2UuD59XJ\"
    -D OTA_PASSWORD=\"password\"
    -D OTA_HOSTNAME=\"lidar-scanner\"
lib_deps =
    garmin/LIDAR-Lite@^3.0.6
    madhephaestus/ESP32Servo@^3.2.0
    marcoschwartz/LiquidCrystal_I2C@^1.1.4

[env:firebeetle32-ota]
